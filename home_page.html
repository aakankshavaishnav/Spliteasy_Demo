<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SplitEasy - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* ===== RESET ===== */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Plus Jakarta Sans', Arial, sans-serif;
  background-color: #FAF8FF;
  color: #131B2E;
  max-width: 400px;
  margin: 0 auto;
}
a { text-decoration: none; }

/* ===== LOGO (green box + white receipt) ===== */
.logo {
  background-color: #017E1A;
  border-radius: 7px;
  display: flex;
  justify-content: center;
  align-items: center;
}
.logo-small { width: 32px; height: 32px; }
.logo-big   { width: 44px; height: 44px; }

.receipt {
  width: 14px;
  height: 22px;
  background-color: white;
  border-radius: 2px;
  position: relative;
}
.logo-big .receipt { width: 17px; height: 30px; }

.line {
  position: absolute;
  left: 20%;
  height: 1px;
  background-color: #0FA37F;
}
.line1 { top: 20%; width: 60%; }
.line2 { top: 34%; width: 45%; }
.split {
  position: absolute;
  left: 22%;
  top: 55%;
  font-size: 4px;
  color: #0FA37F;
}

/* ===== HEADER ===== */
.topbar {
  height: 64px;
  padding: 0 16px;
  box-shadow: 0px 1px 8px rgba(0, 0, 0, 0.04);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.brand { display: flex; align-items: center; gap: 8px; }
.brand-name { font-size: 18px; font-weight: 600; line-height: 22px; }
.brand-tagline { font-size: 11px; font-weight: 700; line-height: 14px; color: #3C4A42; }
.bell { font-size: 18px; color: #131B2E; margin-left: 40px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; }

/* ===== PAGE ===== */
.page { padding: 29px 16px 32px 16px; }

/* ===== HERO ===== */
.hero { text-align: center; margin-bottom: 16px; }

.logo-frame {
  width: 64px;
  height: 64px;
  padding: 2px;
  margin: 0 auto 12px auto;
  background: linear-gradient(45deg, #006C49, #10B981);
  border-radius: 16px;
  box-shadow: 0px 10px 15px -3px rgba(16, 185, 129, 0.2);
}
.logo-white {
  width: 100%;
  height: 100%;
  background-color: white;
  border-radius: 14px;
  display: flex;
  justify-content: center;
  align-items: center;
}
.hero h1 { font-size: 22px; font-weight: 700; line-height: 28px; }
.hero p { margin-top: 4px; font-size: 14px; line-height: 20px; color: #3C4A42; }

/* ===== CARD ===== */
.card {
  padding: 32px 24px 24px 24px;
  background-color: white;
  border-radius: 16px;
  box-shadow: 0px 4px 24px rgba(19, 27, 46, 0.06);
}

/* ===== SOCIAL BUTTONS ===== */
.btn {
  height: 48px;
  margin-bottom: 10px;
  border-radius: 9999px;
  font-size: 14px;
  font-weight: 600;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
}
.btn-google { background-color: white; color: #131B2E; border: 1px solid black; }
.btn-apple  { background-color: #283044; color: #EEF0FF; }

/* ===== DIVIDER ===== */
.divider { margin: 14px 0 16px 0; display: flex; align-items: center; gap: 12px; }
.line-h { flex: 1; height: 1px; background-color: #E2E7FF; }
.divider p { font-size: 12px; line-height: 16px; color: #3C4A42; }

/* ===== FORM ===== */
label {
  display: block;
  padding-left: 4px;
  margin-bottom: 6px;
  font-size: 12px;
  font-weight: 600;
  line-height: 16px;
  color: #3C4A42;
}
.label-row { display: flex; justify-content: space-between; align-items: center; }
.forgot { margin-bottom: 6px; font-size: 11px; font-weight: 700; color: #006C49; }

.input-box {
  height: 48px;
  padding: 0 16px;
  margin-bottom: 14px;
  background-color: #F2F3FF;
  border-radius: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.icon { font-size: 16px; color: #6C7A71; }
.input-box input {
  flex: 1;
  border: none;
  outline: none;
  background-color: transparent;
  font-family: inherit;
  font-size: 14px;
  color: #131B2E;
}

.remember { padding: 4px; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
.remember input { width: 16px; height: 16px; }
.remember-label { margin: 0; padding: 0; font-size: 12px; font-weight: 400; }

.btn-login {
  width: 93%;
  height: 40px;
  background-color: black;
  color: white;
  border: none;
  border-radius: 9999px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0px 8px 20px rgba(16, 185, 129, 0.25);
}
.btn-login:hover { background-color: #006C49; }

/* ===== SIGN UP TEXT ===== */
.signup-text { padding-top: 24px; text-align: center; font-size: 14px; line-height: 20px; color: #3C4A42; }
.signup-text a { font-weight: 600; color: #006C49; }
  </style>
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="topbar">
    <div class="brand">
      <!-- small green logo with white receipt -->
      <div class="logo logo-small">
        <div class="receipt">
          <span class="line line1"></span>
          <span class="line line2"></span>
          <span class="split">&divide; 4</span>
        </div>
      </div>
      <div>
        <h2 class="brand-name">SplitEasy</h2>
        <p class="brand-tagline">Split bills, not friendships.</p>
      </div>
    </div>

    <span class="bell">&#128276;&#xFE0E;</span>

    <img class="avatar" src="https://placehold.co/32x32" alt="User avatar">
  </header>

  <!-- ===== MAIN ===== -->
  <main class="page">

    <section class="hero">
      <div class="logo-frame">
        <div class="logo-white">
          <div class="logo logo-big">
            <div class="receipt">
              <span class="line line1"></span>
              <span class="line line2"></span>
              <span class="split">&divide; 4</span>
            </div>
          </div>
        </div>
      </div>
      <h1>Welcome Back</h1>
      <p>Sign in to access your shared tabs, trip<br>ledgers &amp; live balances.</p>
    </section>

    <section class="card">

      <a href="#" class="btn btn-google">
        <!-- Google "G" logo -->
        <svg width="20" height="20" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Continue with Google
      </a>

      <a href="#" class="btn btn-apple">
        <!-- Apple logo -->
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#EEF0FF">
          <path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/>
        </svg>
        Continue with Apple
      </a>

      <div class="divider">
        <span class="line-h"></span>
        <p>or sign in with email</p>
        <span class="line-h"></span>
      </div>

      <form>
        <label for="email">Email or Phone Number</label>
        <div class="input-box">
          <span class="icon">@</span>
          <input type="text" id="email" value="alex.turner@example.com">
        </div>

        <div class="label-row">
          <label for="password">Password</label>
          <a href="#" class="forgot">Forgot?</a>
        </div>
        <div class="input-box">
          <span class="icon">&#128274;&#xFE0E;</span>
          <input type="password" id="password" value="GoaTrip2024!">
          <span class="icon">&#128065;&#xFE0E;</span>
        </div>

        <div class="remember">
          <input type="checkbox" id="stay">
          <label for="stay" class="remember-label">Stay signed in on this device</label>
        </div>

        <button type="button" class="btn-login">Login &rarr;</button>
      </form>
    </section>

    <p class="signup-text">New to SplitEasy? <a href="#">Create Account</a></p>

  </main>
</body>
</html>
