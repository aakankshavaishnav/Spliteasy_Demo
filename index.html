<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SplitEasy - Login</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="index.css">
</head>

<body>

    <!-- Header -->
    <header class="header">

        <div class="brand">

            <div class="logo">
                <div class="logo-shape"></div>
                <div class="logo-overlay"></div>
                <div class="logo-line line-one"></div>
                <div class="logo-line line-two"></div>
                <span class="divide">÷ 4</span>
            </div>

            <div class="brand-text">
                <h2>SplitEasy</h2>
                <p>Split bills, not friendships.</p>
            </div>

        </div>

        <div class="profile-icon">
            <span>●</span>
        </div>

    </header>


    <!-- Main Content -->
    <main>

        <section class="login-section">

            <!-- Welcome -->
            <div class="welcome">

                <div class="main-logo">
                    <div class="main-logo-inner">
                        <div class="logo-shape"></div>
                        <div class="logo-overlay"></div>
                        <div class="logo-line line-one"></div>
                        <div class="logo-line line-two"></div>
                        <span class="divide">÷ 4</span>
                    </div>
                </div>

                <h1>Welcome Back</h1>

                <p>
                    Sign in to access your shared tabs, trip<br>
                    ledgers & live balances.
                </p>

            </div>


            <!-- Login Card -->
            <div class="login-card">

                <!-- Google -->
                <button class="social-button google">
                    <span class="google-icon">G</span>
                    <span>Continue with Google</span>
                </button>


                <!-- Apple -->
                <button class="social-button apple">
                    <span class="apple-icon">●</span>
                    <span>Continue with Apple</span>
                </button>


                <!-- Divider -->
                <div class="divider">
                    <span></span>
                    <p>or sign in with email</p>
                    <span></span>
                </div>


                <!-- Email -->
                <div class="form-group">

                    <label>Email or Phone Number</label>

                    <div class="input-box">

                        <span class="input-icon">✉</span>

                        <input
                            type="text"
                            value="alex.turner@example.com"
                            placeholder="Email or Phone Number"
                        >

                    </div>

                </div>


                <!-- Password -->
                <div class="form-group">

                    <div class="password-label">

                        <label>Password</label>

                        <a href="#">Forgot?</a>

                    </div>

                    <div class="input-box">

                        <span class="input-icon">🔒</span>

                        <input
                            type="password"
                            value="GoaTrip2024!"
                            placeholder="Password"
                        >

                        <button class="show-password">◉</button>

                    </div>

                </div>


                <!-- Remember -->
                <label class="remember">

                    <input type="checkbox">

                    <span>Stay signed in on this device</span>

                </label>


                <!-- Login -->
                <button class="login-button">

                    <span>Login</span>

                    <span class="arrow">→</span>

                </button>

            </div>


            <!-- Create Account -->
            <div class="create-account">

                <span>New to SplitEasy?</span>

                <a href="#">Create Account</a>

            </div>

        </section>

    </main>

</body>
</html>
