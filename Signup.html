<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SplitEasy - Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Signup.css" />
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand">
        <div class="brand-icon">
          <div class="brand-badge">÷ 4</div>
        </div>
        <div class="brand-text">
          <span class="brand-title">SplitEasy</span>
          <span class="brand-tagline">Split bills, not friendships.</span>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" aria-label="Settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#3C4A42">
            <path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/>
            <path fill-rule="evenodd" clip-rule="evenodd" d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
          </svg>
        </button>
        <img class="profile-avatar" src="https://placehold.co/32x32" alt="User Avatar" />
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="page-wrapper">
    <div class="auth-container">
      
      <!-- Welcome Header -->
      <section class="auth-header">
        <div class="logo-badge">
          <div class="logo-inner">
            <span class="logo-symbol">÷ 4</span>
          </div>
        </div>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">
          Sign in to access your shared tabs, trip ledgers & live balances.
        </p>
      </section>

      <!-- Auth Card -->
      <div class="auth-card">
        
        <!-- Social Sign-in Buttons -->
        <div class="social-buttons">
          <button class="btn btn-social btn-google">
            <svg class="social-icon" viewBox="0 0 24 24" width="20" height="20">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span>Continue with Google</span>
          </button>

          <button class="btn btn-social btn-apple">
            <svg class="social-icon" viewBox="0 0 170 170" width="18" height="18" fill="#EEF0FF">
              <path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-5.02.24-9.88-1.8-14.58-6.12-3.26-2.85-7.17-7.6-11.73-14.25-5.99-8.78-10.74-18.73-14.25-29.84-3.51-11.12-5.27-21.72-5.27-31.8 0-14.15 3.51-26.05 10.53-35.7 7.02-9.65 15.89-14.59 26.62-14.82 4.69 0 9.78 1.18 15.27 3.53 5.49 2.36 9.38 3.53 11.66 3.53 2.05 0 6.05-1.24 12-3.71 5.95-2.48 10.84-3.62 14.67-3.42 12.01.7 21.91 5.3 29.69 13.8-10.74 6.5-16.02 15.68-15.84 27.53.18 9.3 3.65 17.06 10.42 23.28 6.77 6.22 14.88 9.7 24.33 10.44-2.5 7.42-5.88 14.71-10.15 21.87zM119.22 31.87c0-7.3 2.65-14.2 7.95-20.7 5.3-6.5 11.96-10.27 19.98-11.17.18 1.05.27 2.02.27 2.9 0 7.33-2.73 14.37-8.19 21.12-5.46 6.75-12.19 10.53-20.01 11.34-.12-1.05-.18-1.9-.18-2.55z"/>
            </svg>
            <span>Continue with Apple</span>
          </button>
        </div>

        <!-- Divider -->
        <div class="divider">
          <span>or sign in with email</span>
        </div>

        <!-- Login Form -->
        <form class="auth-form" onsubmit="event.preventDefault();">
          <div class="form-group">
            <label for="email" class="form-label">Email or Phone Number</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18" fill="#6C7A71">
                <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
              </svg>
              <input type="text" id="email" class="form-input" value="alex.turner@example.com" />
            </div>
          </div>

          <div class="form-group">
            <div class="label-row">
              <label for="password" class="form-label">Password</label>
              <a href="#" class="forgot-link">Forgot?</a>
            </div>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18" fill="#6C7A71">
                <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
              </svg>
              <input type="password" id="password" class="form-input" value="GoaTrip2024!" />
              <button type="button" class="password-toggle" aria-label="Toggle password visibility">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="#6C7A71">
                  <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="checkbox-group">
            <label class="checkbox-label">
              <input type="checkbox" class="checkbox-input" checked />
              <span class="checkbox-custom"></span>
              <span class="checkbox-text">Stay signed in on this device</span>
            </label>
          </div>

          <button type="submit" class="btn btn-primary">
            <span>Login</span>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
              <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </form>
      </div>

      <!-- Footer Action -->
      <footer class="auth-footer">
        <span>New to SplitEasy?</span>
        <a href="#" class="signup-link">Create Account</a>
      </footer>

    </div>
  </main>

</body>
</html>
